name: Step 3.1 Baseline Evaluation Contract CI

on:
  push:
    branches:
      - baseline/step3.1-evaluation-contract
  pull_request:
    branches:
      - action-space/step8-inventory-actions

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Architecture boundary
        run: npm run architecture

      - name: Strict typecheck
        run: npm run typecheck

      - name: Step 3.1 focused tests
        run: npm run test:baseline-evaluation

      - name: Full inherited and Step 3.1 test suite
        run: npm test

      - name: Build
        run: npm run build

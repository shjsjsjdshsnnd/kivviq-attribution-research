name: Candidate 1 Frozen Evaluation

on:
  push:
    branches: ["phase2/candidate1-aipw"]
    paths:
      - "phase2/candidate1/FROZEN.json"
      - ".github/workflows/candidate1-frozen-evaluation.yml"

permissions:
  contents: write

jobs:
  frozen-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_repo_safety.py
      - run: python scripts/check_phase1_frozen.py
      - run: ruff check .
      - run: mypy
      - run: pytest
      - name: Frozen Candidate 1 evaluation
        run: |
          python phase2/candidate1/evaluate_frozen.py             --output "$RUNNER_TEMP/candidate1-public"             --seal-dir "$RUNNER_TEMP/candidate1-private"
      - run: python scripts/check_repo_safety.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidate1-evaluator-private-holdout
          path: ${{ runner.temp }}/candidate1-private/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: candidate1-frozen-evaluation
          path: ${{ runner.temp }}/candidate1-public/
          if-no-files-found: error
          retention-days: 30
      - name: Persist public Candidate 1 results
        shell: bash
        run: |
          set -euo pipefail
          result_dir="phase2/candidate1/results"
          mkdir -p "$result_dir"
          cp "$RUNNER_TEMP/candidate1-public/candidate1_report.json" "$result_dir/report.json"
          cp "$RUNNER_TEMP/candidate1-public/candidate1_report.md" "$result_dir/report.md"
          cp "$RUNNER_TEMP/candidate1-public/holdout_public_metadata.json" "$result_dir/holdout_public_metadata.json"
          cp "$RUNNER_TEMP/candidate1-public/research-ledger.jsonl" "$result_dir/research-ledger.jsonl"
          python scripts/check_repo_safety.py
          git add -N "$result_dir"
          git diff --check
          git diff -- "$result_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$result_dir"
          git commit -m "Persist frozen Candidate 1 evaluation"
          git push origin "HEAD:${GITHUB_REF_NAME}"

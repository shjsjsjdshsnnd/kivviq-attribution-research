name: Experiment Eligibility Constraints CI
on:
  push:
    branches: [action-space/steps16-18-experiment-eligibility-constraints]
  pull_request:
    branches: [action-space/steps13-15-decision-forms]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:experiment-eligibility-constraints
      - run: npm run architecture
      - run: npm run typecheck
      - run: npm run build

name: Evidence Lab CI

on:
  push:
    branches: [main, "phase1/**", "phase2/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Repository safety
        run: python -m kivviq_evidence_lab.cli safety .
      - name: Phase 2 candidate isolation
        run: python -m kivviq_evidence_lab.phase2.cli firewall .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Phase 1 benchmark
        run: python -m kivviq_evidence_lab.cli benchmark --json
      - name: Phase 1 mutation regression suite
        run: python -m kivviq_evidence_lab.cli mutations
      - name: Phase 2 development measurement
        run: python -m kivviq_evidence_lab.phase2.cli development --json
      - name: Phase 2 sealed holdout measurement
        run: python -m kivviq_evidence_lab.phase2_evaluator.cli deterministic --json

name: Step 4 Customer Journey CI

on:
  push:
    branches:
      - step4/customer-journey-simulation
  pull_request:
    branches:
      - step3/latent-customer-population

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Architecture boundary
        run: npm run architecture

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

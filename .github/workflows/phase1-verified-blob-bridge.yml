name: Prepare verified public kernel blobs

# Temporary transport bridge, removed by the implementation commit.
# It creates three explicitly hashed Git blobs only: no branch writes, merges,
# deployments, dependency execution, or access to merchant/production data.
on:
  push:
    branches: [phase1/steps15-23-measurement-decision-lab]
    paths: [.github/workflows/phase1-verified-blob-bridge.yml]
permissions:
  contents: write
jobs:
  public-blobs:
    if: github.repository == 'shjsjsjdshsnnd/kivviq-attribution-research'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create only allowlisted, byte-verified public source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          expected = {
            'src/simulation/simulator.ts': ('432bc9e72c80f48e70b20ce8a1a4dd636c37e3a5', '128d46394a2b7246b60c03a35001b8f38711d41f'),
            'src/simulation/commerce.ts': ('c6e96e20adf925e7b4d802970fdad3bfde1ab6cc', '766755367af1212de6e4b4037e767c81885ee40a'),
            'src/simulation/session.ts': ('6ec70d09e9554934e7bc67eff48900b2debc075f', '96b7b4325bd8d3f5521a7d5c2fe9b404c2a1ace2'),
          }
          def blob_hash(data):
            return hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
          result = {}
          for name, (before, after) in expected.items():
            original = pathlib.Path(name).read_bytes()
            assert blob_hash(original) == before, 'source changed: ' + name
            revised = original.replace(b'.applyAt(', b'.applyOccurrenceAt(')
            assert blob_hash(revised) == after, 'modified bytes differ from tested tree: ' + name
            body = json.dumps({'content': revised.decode('utf-8'), 'encoding': 'utf-8'}).encode()
            request = urllib.request.Request(
              'https://api.github.com/repos/shjsjsjdshsnnd/kivviq-attribution-research/git/blobs',
              data=body, method='POST', headers={
                'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                'Accept': 'application/vnd.github+json',
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28',
              })
            with urllib.request.urlopen(request, timeout=30) as response:
              created = json.load(response)
            assert created['sha'] == after, 'published blob hash mismatch: ' + name
            result[name] = after
          print(json.dumps({'verified_public_blobs': result}, sort_keys=True))
          PY

name: Candidate 3 Contract Freeze

on:
  push:
    branches: ["phase2/candidate3-contracts"]
    paths:
      - "src/phase2_candidate3_contracts/**"
      - "phase2/candidates/candidate3/CONTRACTS.md"
      - "phase2/candidates/candidate3/freeze_contracts.py"
      - "tests/candidate3_contracts/**"

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_repo_safety.py
      - run: python scripts/check_phase1_frozen.py
      - run: pytest tests/candidate3_contracts
      - run: ruff check .
      - run: mypy
      - name: Freeze Candidate 3 contracts
        run: python phase2/candidates/candidate3/freeze_contracts.py
      - name: Persist frozen contract manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_repo_safety.py
          git add phase2/candidates/candidate3/FROZEN_CONTRACTS.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Contract manifest unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Freeze Candidate 3 contracts before holdout"
          git push origin "HEAD:${GITHUB_REF_NAME}"

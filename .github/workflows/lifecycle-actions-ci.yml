name: Step 10 Lifecycle Actions CI

on:
  push:
    branches:
      - action-space/step10-lifecycle-actions
  pull_request:
    branches:
      - action-space/step9-cro-actions

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Architecture boundary
        run: npm run architecture
      - name: Typecheck
        run: npm run typecheck
      - name: Full inherited + Step 10 tests
        # Keep CI deterministic on GitHub-hosted runners. The complete suite passed,
        # but Vitest's worker RPC timed out under unrestricted parallelism.
        run: npm test -- --maxWorkers=2 --minWorkers=1
      - name: Build
        run: npm run build

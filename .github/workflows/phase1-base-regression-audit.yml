name: Phase 1 Base Regression Audit
on:
  push:
    branches: [audit/phase1-base-regressions]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run tests/scenario_library/measurement-scenarios.test.ts tests/website_cro/model-contract.test.ts --maxWorkers=1

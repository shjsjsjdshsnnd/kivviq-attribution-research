name: Step 3.8 Greedy Baseline Operators CI

on:
  push:
    branches:
      - baseline/step3.8-greedy-operators
  pull_request:
    branches:
      - baseline/step3.7-merchandising-heuristics

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Architecture boundary
        run: npm run architecture

      - name: Strict typecheck
        run: npm run typecheck

      - name: Step 3.8 focused tests
        run: npm run test:greedy-operators

      - name: Full inherited and Step 3.8 suite
        run: npm test

      - name: Build
        run: npm run build

      - name: Frozen Step 3.8 fingerprints
        run: |
          node --input-type=module <<'NODE'
          import {
            GREEDY_BASELINE_OPERATORS,
            GREEDY_IMPLEMENTATION_FINGERPRINTS,
            GREEDY_FROZEN_STEP_3_1_COMMIT,
            GREEDY_FROZEN_STEP_3_7_COMMIT,
            GREEDY_METRIC_SET_VERSION,
            GREEDY_SIMULATOR_VERSION,
            FROZEN_GREEDY_CONFIGURATIONS,
            greedyConfigurationFingerprint,
          } from "./dist/operator/index.js";
          import {
            CANONICAL_BASELINE_EVALUATION_CONTRACT_V1,
          } from "./dist/evaluation/index.js";

          console.log("step3_1_frozen_commit=" + GREEDY_FROZEN_STEP_3_1_COMMIT);
          console.log("step3_7_frozen_commit=" + GREEDY_FROZEN_STEP_3_7_COMMIT);
          console.log("step3_1_contract_fingerprint=" + CANONICAL_BASELINE_EVALUATION_CONTRACT_V1.contractFingerprint);
          console.log("action_ontology_version=" + CANONICAL_BASELINE_EVALUATION_CONTRACT_V1.actionSpace.ontologySchemaVersion);
          console.log("metric_set_version=" + GREEDY_METRIC_SET_VERSION);
          console.log("simulator_version=" + GREEDY_SIMULATOR_VERSION);

          for (const [name, operator] of Object.entries(GREEDY_BASELINE_OPERATORS)) {
            console.log(name + "_operator_id=" + operator.metadata.operatorId);
            console.log(name + "_operator_version=" + operator.metadata.operatorVersion);
            console.log(name + "_implementation_fingerprint=" + GREEDY_IMPLEMENTATION_FINGERPRINTS[name]);
            console.log(name + "_configuration_fingerprint=" + greedyConfigurationFingerprint(FROZEN_GREEDY_CONFIGURATIONS[name]));
            console.log(name + "_configuration=" + JSON.stringify(FROZEN_GREEDY_CONFIGURATIONS[name]));
          }
          NODE

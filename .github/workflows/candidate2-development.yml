name: Candidate 2 Development

on:
  push:
    branches: ["phase2/candidate2-aipw-dr"]
    paths:
      - "phase2/candidates/candidate2/model.py"
      - "phase2/candidates/candidate2/development_worlds.py"
      - "phase2/candidates/candidate2/run_development.py"
      - "tests/candidate2/**"
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_repo_safety.py
      - run: python scripts/check_phase1_frozen.py
      - run: pytest tests/candidate2
      - name: Run Candidate 2 development grid
        run: python phase2/candidates/candidate2/run_development.py
      - name: Persist development record
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_repo_safety.py
          git add phase2/candidates/candidate2/development_results.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record Candidate 2 development results"
          git push origin "HEAD:${GITHUB_REF_NAME}"

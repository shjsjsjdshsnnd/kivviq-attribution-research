name: Full research benchmark

on:
  push:
    branches: ["phase1/research-foundation"]
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/research-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Pre-run repository safety
        run: python scripts/check_repo_safety.py
      - run: ruff check .
      - run: mypy
      - run: pytest
      - name: Full repeated Phase 1 benchmark
        run: python examples/run_benchmark.py --output research_output
      - name: Final repository safety
        run: python scripts/check_repo_safety.py
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-research-validation
          path: research_output/
          if-no-files-found: error
          retention-days: 30

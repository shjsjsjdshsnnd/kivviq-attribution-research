name: Action Space + Business State Freeze Gate
on:
  push:
    branches:
      - integration/action-space-steps1-24-business-state-phase1-v2
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:action-space-validation
      - run: npm run test:business-state
      - run: npm run test:phase1-validation
      - run: npm run check

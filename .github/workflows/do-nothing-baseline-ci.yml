name: Step 3.2 DO_NOTHING Baseline CI

on:
  push:
    branches:
      - baseline/step3.2-do-nothing
  pull_request:
    branches:
      - baseline/step3.1-evaluation-contract

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Architecture boundary
        run: npm run architecture

      - name: Strict typecheck
        run: npm run typecheck

      - name: Step 3.2 focused tests
        run: npm run test:do-nothing

      - name: Full inherited and Step 3.2 suite
        run: npm test

      - name: Build
        run: npm run build

      - name: Frozen Step 3.2 fingerprints
        run: |
          node --input-type=module <<'NODE'
          import {
            DO_NOTHING_CONFIGURATION,
            DO_NOTHING_FROZEN_STEP_3_1_COMMIT,
            DO_NOTHING_IMPLEMENTATION_FINGERPRINT,
            DO_NOTHING_METADATA,
            operatorFingerprint,
          } from "./dist/operator/index.js";
          import {
            CANONICAL_BASELINE_EVALUATION_CONTRACT_V1,
          } from "./dist/evaluation/index.js";
          import {
            WORLD_SIMULATOR_VERSION,
          } from "./dist/simulation/kernel.js";

          console.log(
            "do_nothing_operator_id=" + DO_NOTHING_METADATA.operatorId,
          );
          console.log(
            "do_nothing_operator_version=" + DO_NOTHING_METADATA.operatorVersion,
          );
          console.log(
            "do_nothing_implementation_fingerprint=" +
              DO_NOTHING_IMPLEMENTATION_FINGERPRINT,
          );
          console.log(
            "do_nothing_configuration_fingerprint=" +
              operatorFingerprint(DO_NOTHING_CONFIGURATION),
          );
          console.log(
            "step3_1_frozen_commit=" + DO_NOTHING_FROZEN_STEP_3_1_COMMIT,
          );
          console.log(
            "step3_1_contract_fingerprint=" +
              CANONICAL_BASELINE_EVALUATION_CONTRACT_V1.contractFingerprint,
          );
          console.log(
            "action_ontology_version=" +
              DO_NOTHING_METADATA.supportedActionOntologyVersion,
          );
          console.log(
            "validation_simulator_version=" + WORLD_SIMULATOR_VERSION,
          );
          NODE

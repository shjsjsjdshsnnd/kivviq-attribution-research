name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_repo_safety.py
      - run: python scripts/check_phase1_frozen.py
      - name: Verify frozen Candidate 1
        if: hashFiles('research/candidate1/FROZEN.json') != ''
        run: python scripts/check_candidate1_frozen.py
      - run: ruff check .
      - run: mypy
      - run: pytest
      - run: python examples/run_benchmark.py --quick --output /tmp/attribution-benchmark

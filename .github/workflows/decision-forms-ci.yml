name: Compound and Information Actions CI
on:
  push:
    branches: [action-space/steps13-15-decision-forms]
  pull_request:
    branches: [action-space/step12-timing-semantics]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check

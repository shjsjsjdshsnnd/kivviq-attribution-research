name: Candidate 3 Holdout Seal

on:
  push:
    branches: ["phase2/candidate3-holdout-v1-evaluator"]
    paths:
      - ".github/workflows/candidate3-holdout-seal.yml"
      - "phase2/evaluator/candidate3_holdout_spec.py"
      - "phase2/evaluator/seal_candidate3_holdout.py"
      - "phase2/evaluator/candidate3_frozen_contracts.json"

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_repo_safety.py
      - run: python scripts/check_phase1_frozen.py
      - name: Assert Candidate 3 estimator does not exist
        shell: bash
        run: |
          set -euo pipefail
          test ! -e phase2/candidates/candidate3/model.py
          test ! -e src/phase2_candidates/candidate3
      - name: Verify frozen contract status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("phase2/evaluator/candidate3_frozen_contracts.json").read_text())
          assert p["status"] == "CONTRACTS_FROZEN_BEFORE_HOLDOUT_SEAL"
          assert p["estimator_implemented"] is False
          assert p["holdout_instantiated"] is False
          PY
      - name: Instantiate sealed Candidate 3 holdout
        run: |
          python phase2/evaluator/seal_candidate3_holdout.py             --contracts phase2/evaluator/candidate3_frozen_contracts.json             --seal-out /tmp/candidate3-holdout/candidate3-holdout-v1.seal.json             --metadata-out phase2/evaluator/candidate3-holdout-v1.public.json
      - name: Save evaluator-only private seal
        uses: actions/cache/save@v4
        with:
          path: /tmp/candidate3-holdout/candidate3-holdout-v1.seal.json
          key: candidate3-holdout-v1-${{ hashFiles('phase2/evaluator/candidate3_holdout_spec.py', 'phase2/evaluator/candidate3_frozen_contracts.json') }}
      - name: Persist public metadata only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_repo_safety.py
          git add phase2/evaluator/candidate3-holdout-v1.public.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record Candidate 3 sealed holdout metadata"
          git push origin "HEAD:${GITHUB_REF_NAME}"

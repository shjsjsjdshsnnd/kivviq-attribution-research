name: Prepare verified public kernel blobs

# Temporary transport bridge, removed by the implementation commit.
# Creates one explicitly hashed public runtime blob: no branch writes, merges,
# deployments, dependency execution, or access to merchant/production data.
on:
  push:
    branches: [phase1/steps15-23-measurement-decision-lab]
    paths: [.github/workflows/phase1-verified-blob-bridge.yml]
permissions:
  contents: write
jobs:
  public-blobs:
    if: github.repository == 'shjsjsjdshsnnd/kivviq-attribution-research'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create only the allowlisted byte-verified public runtime blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          name = 'src/external_reality/index.ts'
          def blob_hash(data):
            return hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
          original = pathlib.Path(name).read_bytes()
          assert blob_hash(original) == 'c5746138ab91aeb55810e978f31870199692b8c8', 'source changed'
          constant = '/** Diagnostic identity only; causal coefficients and random-stream keys are unchanged. */\nexport const EXTERNAL_APPLICATION_IDENTITY_VERSION = "external-effect-occurrence/1.0.0" as const;\n\n'
          method = '''  /**
             * Kernel event labels can recur on later dates (for example repeat need
             * cycles). Address one logical occurrence by label AND event time, without
             * altering random keys or hiding conflicting resolutions at the same time.
             * applyAt remains the strict legacy API for globally unique caller IDs.
             */
            public applyOccurrenceAt(
              logicalId: string,
              target: ExternalTarget,
              timestampMs: number,
              context: ExternalContext = {},
            ): number {
              if (!logicalId.trim() || !Number.isFinite(timestampMs)) {
                throw new RangeError("external occurrence requires a nonempty label and finite event time");
              }
              const occurrenceId = `${EXTERNAL_APPLICATION_IDENTITY_VERSION}:${JSON.stringify([logicalId, timestampMs])}`;
              return this.applyAt(occurrenceId, target, timestampMs, context);
            }

          '''
          # YAML block indentation is removed by the runner; the method text has
          # its exact TypeScript two/four/six-space indentation here.
          assert original.count(b'export type ExternalDomain =') == 1
          assert original.count(b'  public applyAt(') == 1
          revised = original.replace(b'export type ExternalDomain =', constant.encode() + b'export type ExternalDomain =')
          revised = revised.replace(b'  public applyAt(', method.encode() + b'  public applyAt(')
          expected = '24993de1d4d07ddbcea89b813274327d3e31c006'
          assert blob_hash(revised) == expected, 'modified bytes differ from the tested source tree'
          request = urllib.request.Request(
            'https://api.github.com/repos/shjsjsjdshsnnd/kivviq-attribution-research/git/blobs',
            data=json.dumps({'content': revised.decode(), 'encoding': 'utf-8'}).encode(), method='POST',
            headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.urlopen(request, timeout=30) as response:
            created = json.load(response)
          assert created['sha'] == expected, 'published blob mismatch'
          print(json.dumps({'verified_public_blobs': {name: expected}}, sort_keys=True))
          PY

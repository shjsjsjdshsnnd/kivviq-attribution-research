name: Candidate 1 Development

on:
  push:
    branches: ["phase2/candidate1-aipw"]
    paths:
      - "phase2/candidate1/**"
      - "tests/candidate1/**"
      - ".github/workflows/candidate1-development.yml"
  pull_request:
    paths:
      - "phase2/candidate1/**"
      - "tests/candidate1/**"
      - ".github/workflows/candidate1-development.yml"

permissions:
  contents: read

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_repo_safety.py
      - run: python scripts/check_phase1_frozen.py
      - run: ruff check phase2/candidate1 tests/candidate1
      - run: pytest tests/candidate1
      - name: DEVELOPMENT only
        run: python phase2/candidate1/development.py

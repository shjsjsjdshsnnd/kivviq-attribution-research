name: Candidate 3 Holdout Evaluator Validate

on:
  push:
    branches: ["phase2/candidate3-holdout-v1-evaluator"]
    paths:
      - ".github/workflows/candidate3-holdout-evaluator-validate.yml"
      - "phase2/evaluator/candidate3_holdout_scoring.json"
      - "phase2/evaluator/candidate3_holdout_evaluator.py"
      - "phase2/evaluator/test_candidate3_holdout_evaluator.py"
      - "phase2/evaluator/consume_candidate3_holdout.py"
      - "phase2/evaluator/run_candidate3_sealed_holdout.py"
      - "phase2/evaluator/record_candidate3_holdout_result.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: phase2/candidate3-ato-estimator
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install -e candidate
      - run: python scripts/check_repo_safety.py
      - run: python scripts/check_phase1_frozen.py
      - run: python phase2/evaluator/test_candidate3_holdout_evaluator.py
      - run: ruff check phase2/evaluator/candidate3_holdout_evaluator.py phase2/evaluator/test_candidate3_holdout_evaluator.py phase2/evaluator/consume_candidate3_holdout.py phase2/evaluator/run_candidate3_sealed_holdout.py phase2/evaluator/record_candidate3_holdout_result.py
      - run: mypy --ignore-missing-imports phase2/evaluator/candidate3_holdout_evaluator.py phase2/evaluator/consume_candidate3_holdout.py phase2/evaluator/run_candidate3_sealed_holdout.py phase2/evaluator/record_candidate3_holdout_result.py

name: Step 3.9 Flawed Optimization Baselines CI

on:
  push:
    branches:
      - baseline/step3.9-flawed-optimizers
  pull_request:
    branches:
      - baseline/step3.8-greedy-operators

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Architecture boundary
        run: npm run architecture

      - name: Strict typecheck
        run: npm run typecheck

      - name: Step 3.9 focused tests
        run: npm run test:flawed-optimizers

      - name: Full inherited and Step 3.9 suite
        run: npm test

      - name: Build
        run: npm run build

      - name: Frozen Step 3.9 fingerprints
        run: |
          node --input-type=module <<'NODE'
          import {
            FLAWED_OPTIMIZER_BASELINE_OPERATORS,
            FLAWED_OPTIMIZER_IMPLEMENTATION_FINGERPRINTS,
            FLAWED_OPTIMIZER_FROZEN_STEP_3_1_COMMIT,
            FLAWED_OPTIMIZER_FROZEN_STEP_3_8_COMMIT,
            FLAWED_OPTIMIZER_METRIC_SET_VERSION,
            FLAWED_OPTIMIZER_SIMULATOR_VERSION,
            FLAWED_OPTIMIZER_ECOMMERCE_ECONOMICS_VERSION,
            FLAWED_OPTIMIZER_PRODUCT_ECONOMICS_VERSION,
            FROZEN_FLAWED_OPTIMIZER_CONFIGURATIONS,
            flawedOptimizerConfigurationFingerprint,
          } from "./dist/operator/index.js";
          import {
            CANONICAL_BASELINE_EVALUATION_CONTRACT_V1,
          } from "./dist/evaluation/index.js";

          console.log("step3_1_frozen_commit=" + FLAWED_OPTIMIZER_FROZEN_STEP_3_1_COMMIT);
          console.log("step3_8_frozen_commit=" + FLAWED_OPTIMIZER_FROZEN_STEP_3_8_COMMIT);
          console.log("step3_1_contract_fingerprint=" + CANONICAL_BASELINE_EVALUATION_CONTRACT_V1.contractFingerprint);
          console.log("action_ontology_version=" + CANONICAL_BASELINE_EVALUATION_CONTRACT_V1.actionSpace.ontologySchemaVersion);
          console.log("metric_set_version=" + FLAWED_OPTIMIZER_METRIC_SET_VERSION);
          console.log("ecommerce_economics_version=" + FLAWED_OPTIMIZER_ECOMMERCE_ECONOMICS_VERSION);
          console.log("product_economics_version=" + FLAWED_OPTIMIZER_PRODUCT_ECONOMICS_VERSION);
          console.log("simulator_version=" + FLAWED_OPTIMIZER_SIMULATOR_VERSION);

          for (const [name, operator] of Object.entries(FLAWED_OPTIMIZER_BASELINE_OPERATORS)) {
            console.log(name + "_operator_id=" + operator.metadata.operatorId);
            console.log(name + "_operator_version=" + operator.metadata.operatorVersion);
            console.log(name + "_implementation_fingerprint=" + FLAWED_OPTIMIZER_IMPLEMENTATION_FINGERPRINTS[name]);
            console.log(name + "_configuration_fingerprint=" + flawedOptimizerConfigurationFingerprint(FROZEN_FLAWED_OPTIMIZER_CONFIGURATIONS[name]));
            console.log(name + "_configuration=" + JSON.stringify(FROZEN_FLAWED_OPTIMIZER_CONFIGURATIONS[name]));
          }
          NODE

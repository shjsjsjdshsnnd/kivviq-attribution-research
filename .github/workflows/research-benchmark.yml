name: Full research benchmark

on:
  push:
    branches: ["phase1/research-foundation"]
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/research-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Pre-run repository safety
        run: python scripts/check_repo_safety.py
      - run: ruff check .
      - run: mypy
      - run: pytest
      - name: Full repeated Phase 1 benchmark
        run: python examples/run_benchmark.py --output research_output
      - name: Final repository safety
        run: python scripts/check_repo_safety.py
      - name: Persist compact Phase 1 validation outputs
        shell: bash
        run: |
          set -euo pipefail
          report_dir="docs/reports/phase1"
          mkdir -p "$report_dir"
          cp research_output/phase1_research_report.md "$report_dir/research_report.md"
          cp research_output/failure_modes.json "$report_dir/failure_modes.json"
          cp research_output/failure_modes.md "$report_dir/failure_modes.md"
          cp research_output/matrix.json "$report_dir/matrix.json"
          cp research_output/simulator_bias_audit.json "$report_dir/simulator_bias_audit.json"

          python scripts/check_repo_safety.py
          git add -N "$report_dir"
          git status --short
          git diff --check
          git diff -- "$report_dir"

          if ! git diff --quiet -- "$report_dir"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$report_dir"
            git commit -m "Persist Phase 1 validation report"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-research-validation
          path: research_output/
          if-no-files-found: error
          retention-days: 30

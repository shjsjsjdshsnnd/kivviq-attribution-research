name: Evidence Lab CI

on:
  push:
    branches: [main, "phase1/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Repository safety
        run: python -m kivviq_evidence_lab.cli safety .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Benchmark
        run: python -m kivviq_evidence_lab.cli benchmark --json
      - name: Mutation regression suite
        run: python -m kivviq_evidence_lab.cli mutations

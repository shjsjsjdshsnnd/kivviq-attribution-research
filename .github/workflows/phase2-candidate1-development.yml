name: Phase 2 Candidate 1 Development

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate1-development:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.KIVVIQ_RESEARCH_ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Require research-only model credential
        run: test -n "$ANTHROPIC_API_KEY"
      - name: Repository safety
        run: python -m kivviq_evidence_lab.cli safety .
      - name: Candidate isolation
        run: python -m kivviq_evidence_lab.phase2.cli firewall .
      - name: Static validation
        run: |
          ruff check .
          mypy src
          python -m unittest discover -s tests -v
      - name: Record fixed Candidate 1 manifest
        run: python -m kivviq_evidence_lab.phase2.candidate1_cli manifest
      - name: Run 96-case Candidate 1 development suite
        run: python -m kivviq_evidence_lab.phase2.candidate1_cli development --json | tee candidate1-development.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate1-development-result
          path: candidate1-development.json
          if-no-files-found: error

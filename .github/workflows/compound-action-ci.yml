name: Step 13 Compound Actions CI
on:
  push:
    branches: [action-space/step13-compound-actions]
  pull_request:
    branches: [action-space/step12-timing-semantics]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Architecture
        run: npm run architecture
      - name: Typecheck
        run: npm run typecheck
      - name: Step 13 tests
        run: npm run test:compound-action
      - name: Full inherited tests
        run: npm test
      - name: Build
        run: npm run build

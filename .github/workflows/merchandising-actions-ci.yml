name: Step 7 Merchandising Actions CI

on:
  push:
    branches:
      - action-space/step7-merchandising-actions
  pull_request:
    branches:
      - action-space/step6-shipping-actions

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Architecture boundary
        run: npm run architecture
      - name: Typecheck
        run: npm run typecheck
      - name: Full inherited + Step 7 tests
        run: npm test
      - name: Build
        run: npm run build

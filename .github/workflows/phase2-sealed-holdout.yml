name: Phase 2 Sealed Holdout

on:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: "Frozen candidate version being evaluated"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sealed-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development tooling
        run: python -m pip install -e ".[dev]"
      - name: Repository safety
        run: python -m kivviq_evidence_lab.cli safety .
      - name: Candidate isolation
        run: python -m kivviq_evidence_lab.phase2.cli firewall .
      - name: Verify requested candidate version
        run: |
          test "${{ inputs.candidate_version }}" = "phase1-deterministic-v1"
      - name: Sealed deterministic control
        run: python -m kivviq_evidence_lab.phase2_evaluator.cli deterministic --json

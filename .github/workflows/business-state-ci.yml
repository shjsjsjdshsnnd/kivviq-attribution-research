name: Business State Steps 1-25

on:
  pull_request:
    paths:
      - "src/business_state/**"
      - "tests/business_state/**"
      - "docs/business-state-steps1-25.md"
      - "src/index.ts"
      - "package.json"
      - ".dependency-cruiser.cjs"
      - ".github/workflows/business-state-ci.yml"
  push:
    branches:
      - "business-state/steps1-25-v4"
    paths:
      - "src/business_state/**"
      - "tests/business_state/**"
      - "docs/business-state-steps1-25.md"
      - "src/index.ts"
      - "package.json"
      - ".dependency-cruiser.cjs"
      - ".github/workflows/business-state-ci.yml"

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: npm run architecture
      - run: npm run typecheck
      - run: npm run test:business-state
      - run: npm run build

  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: npm test

name: Step 3.4 Advertising Heuristic Baselines CI

on:
  push:
    branches:
      - baseline/step3.4-advertising-heuristics
  pull_request:
    branches:
      - baseline/step3.3-status-quo

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Architecture boundary
        run: npm run architecture

      - name: Strict typecheck
        run: npm run typecheck

      - name: Step 3.4 focused tests
        run: npm run test:advertising-heuristics

      - name: Full inherited and Step 3.4 suite
        run: npm test

      - name: Build
        run: npm run build

      - name: Frozen Step 3.4 fingerprints
        run: |
          node --input-type=module <<'NODE'
          import {
            ADVERTISING_HEURISTIC_BASELINE_OPERATORS,
            ADVERTISING_HEURISTIC_IMPLEMENTATION_FINGERPRINTS,
            ADVERTISING_HEURISTIC_FROZEN_STEP_3_1_COMMIT,
            ADVERTISING_HEURISTIC_FROZEN_STEP_3_3_COMMIT,
            ADVERTISING_HEURISTIC_METRIC_SET_VERSION,
            ADVERTISING_HEURISTIC_ADVERTISING_ECONOMICS_VERSION,
            FROZEN_ADVERTISING_HEURISTIC_CONFIGURATIONS,
            advertisingHeuristicConfigurationFingerprint,
          } from "./dist/operator/index.js";
          import {
            CANONICAL_BASELINE_EVALUATION_CONTRACT_V1,
          } from "./dist/evaluation/index.js";

          console.log("step3_1_frozen_commit=" + ADVERTISING_HEURISTIC_FROZEN_STEP_3_1_COMMIT);
          console.log("step3_3_frozen_commit=" + ADVERTISING_HEURISTIC_FROZEN_STEP_3_3_COMMIT);
          console.log("step3_1_contract_fingerprint=" + CANONICAL_BASELINE_EVALUATION_CONTRACT_V1.contractFingerprint);
          console.log("action_ontology_version=" + CANONICAL_BASELINE_EVALUATION_CONTRACT_V1.actionSpace.ontologySchemaVersion);
          console.log("metric_set_version=" + ADVERTISING_HEURISTIC_METRIC_SET_VERSION);
          console.log("advertising_economics_version=" + ADVERTISING_HEURISTIC_ADVERTISING_ECONOMICS_VERSION);

          for (const [name, operator] of Object.entries(ADVERTISING_HEURISTIC_BASELINE_OPERATORS)) {
            console.log(name + "_operator_id=" + operator.metadata.operatorId);
            console.log(name + "_operator_version=" + operator.metadata.operatorVersion);
            console.log(name + "_implementation_fingerprint=" + ADVERTISING_HEURISTIC_IMPLEMENTATION_FINGERPRINTS[name]);
            console.log(name + "_configuration_fingerprint=" + advertisingHeuristicConfigurationFingerprint(FROZEN_ADVERTISING_HEURISTIC_CONFIGURATIONS[name]));
            console.log(name + "_configuration=" + JSON.stringify(FROZEN_ADVERTISING_HEURISTIC_CONFIGURATIONS[name]));
          }
          NODE

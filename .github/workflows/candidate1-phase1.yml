name: Candidate 1 Frozen Phase 1

on:
  push:
    branches: ["phase2/candidate1-outcome-regression"]
    paths:
      - "phase2/candidates/candidate1/run_frozen_phase1.py"
      - "phase2/candidates/candidate1/freeze_manifest.json"
      - "tests/candidate1/test_candidate1_freeze.py"
      - ".github/workflows/candidate1-phase1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen_phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_repo_safety.py
      - run: python scripts/check_phase1_frozen.py
      - run: pytest tests/candidate1/test_candidate1_freeze.py
      - name: FROZEN_PHASE1 evaluation
        run: python phase2/candidates/candidate1/run_frozen_phase1.py

name: Candidate 3 Development

on:
  push:
    branches: ["phase2/candidate3-ato-estimator"]
    paths:
      - "src/phase2_candidate3_estimator/**"
      - "phase2/candidates/candidate3/development_worlds.py"
      - "phase2/candidates/candidate3/run_development.py"
      - "tests/candidate3/**"
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_repo_safety.py
      - run: python scripts/check_phase1_frozen.py
      - run: pytest tests/candidate3 tests/candidate3_contracts
      - run: ruff check .
      - run: mypy
      - name: Verify frozen Candidate 3 contract hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=json.loads(Path("phase2/candidates/candidate3/FROZEN_CONTRACTS.json").read_text())
          assert hashlib.sha256(Path("src/phase2_candidate3_contracts/contracts.py").read_bytes()).hexdigest()==p["contract_source_sha256"]
          assert hashlib.sha256(Path("phase2/candidates/candidate3/CONTRACTS.md").read_bytes()).hexdigest()==p["contract_document_sha256"]
          PY
      - name: Run Candidate 3 development
        shell: bash
        run: |
          set -euo pipefail
          if [ -f phase2/candidates/candidate3/FREEZE_REQUESTED ] || [ -f phase2/candidates/candidate3/FROZEN_IMPLEMENTATION.json ]; then
            echo "Candidate 3 development is locked; development rerun skipped."
            exit 0
          fi
          python phase2/candidates/candidate3/run_development.py
      - name: Persist development record
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_repo_safety.py
          git add phase2/candidates/candidate3/development_results.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Development result unchanged."
            exit 0
          fi
          if git diff --cached --quiet; then
            echo "Development result unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record Candidate 3 development results"
          git push origin "HEAD:${GITHUB_REF_NAME}"

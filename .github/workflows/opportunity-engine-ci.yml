name: Opportunity Engine CI

on:
  push:
    branches:
      - "opportunity/**"
    paths:
      - "src/opportunity_engine/**"
      - "tests/opportunity_engine/**"
      - "src/index.ts"
      - "package.json"
      - ".github/workflows/opportunity-engine-ci.yml"
  pull_request:
    paths:
      - "src/opportunity_engine/**"
      - "tests/opportunity_engine/**"
      - "src/index.ts"
      - "package.json"
      - ".github/workflows/opportunity-engine-ci.yml"

jobs:
  opportunity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:opportunity
      - run: npm run test:action-space-validation
      - run: npm run build

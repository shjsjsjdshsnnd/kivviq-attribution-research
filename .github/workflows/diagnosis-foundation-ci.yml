name: Diagnosis Engine Foundation

on:
  push:
    branches:
      - 'diagnosis/**'
  pull_request:
    paths:
      - 'src/diagnosis/**'
      - 'src/diagnosis_integration/**'
      - 'src/business_state/**'
      - 'tests/diagnosis/**'
      - 'tests/diagnosis_integration/**'
      - 'tests/business_state/**'
      - 'scripts/test-diagnosis.mjs'
      - 'tsconfig*.json'
      - 'package*.json'
      - '.github/workflows/diagnosis-foundation-ci.yml'

permissions:
  contents: read

jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci --no-audit --no-fund
      - name: Strict diagnosis core typecheck and deterministic/adversarial tests
        run: node scripts/test-diagnosis.mjs
      - name: Canonical adapter and merchant-local calendar integration tests
        run: npm exec -- vitest run tests/diagnosis_integration --maxWorkers=1
  repository-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci --no-audit --no-fund
      - name: Existing architecture, types, tests and build
        run: npm run check

name: Candidate 1 Freeze Check

on:
  push:
    branches: ["phase2/candidate1-outcome-regression"]
    paths:
      - "phase2/candidates/candidate1/model.py"
      - "phase2/candidates/candidate1/candidate_definition.py"
      - "phase2/candidates/candidate1/development_results.json"
      - "phase2/candidates/candidate1/freeze_candidate.py"
      - ".github/workflows/candidate1-freeze.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_repo_safety.py
      - run: python scripts/check_phase1_frozen.py
      - run: ruff check phase2/candidates/candidate1
      - run: python phase2/candidates/candidate1/freeze_candidate.py

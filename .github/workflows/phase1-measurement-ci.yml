name: Phase 1 Measurement and Decision Lab

on:
  push:
    branches: [phase1/steps15-23-measurement-decision-lab]
  pull_request:
    branches: [step14/external-reality]

permissions:
  contents: read

concurrency:
  group: phase1-measurement-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: npm ci --no-audit --no-fund
      - run: npm run architecture
      - run: npm run typecheck
      - run: npx vitest run tests/measurement_corruption tests/scenario_library tests/phase1_validation tests/external_reality/occurrence-identity.test.ts --maxWorkers=1 --reporter=verbose
      - run: npm run build
      - name: Observed-only CLI and evaluator replay
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/kivviq-private-manifest.json"
          first="$RUNNER_TEMP/kivviq-observed-1.json"
          second="$RUNNER_TEMP/kivviq-observed-2.json"
          node dist/evaluation/simulate-cli.js --scenario 9274 --seed 88213 --manifest "$manifest" > "$first"
          node dist/evaluation/simulate-cli.js --replay "$manifest" > "$second"
          cmp "$first" "$second"
          node --input-type=module - "$first" <<'NODE'
          import { readFileSync } from 'node:fs';
          import { parseOperatorObservation } from './dist/observation/corrupted-world.js';
          const value = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          parseOperatorObservation(value);
          if ('payload' in value || 'groundTruth' in value || 'audit' in value) throw new Error('evaluator data in observed output');
          NODE
          test "$(stat -c '%a' "$manifest")" = "600"
          rm "$manifest" "$first" "$second"
      - name: Exact oracle replay and evidence-backed Phase 1 status
        shell: bash
        run: |
          set -euo pipefail
          oracle="$RUNNER_TEMP/kivviq-private-oracle.json"
          matrix="$RUNNER_TEMP/kivviq-private-validation.json"
          trap 'rm -f "$oracle" "$matrix"' EXIT
          npm run oracle:control -- --out "$oracle" --selected a0
          npm run replay:oracle -- --input "$oracle"
          set +e
          npm run validate:phase1 -- --out "$matrix" --run-id "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          result=$?
          set -e
          # A partial matrix is deliberately not a Phase 1 pass. Every registered
          # executable case must pass. The only allowed Phase 1 failures here are
          # explicit coverage shortfalls for the still-incomplete adversarial and
          # difficulty curricula; scientific/mechanism failures remain fatal.
          test "$result" = "2"
          node --input-type=module - "$matrix" <<'NODE'
          import { readFileSync } from 'node:fs';
          import { assessArtifactBackedAcceptance } from './dist/evaluation/validation-evidence.js';
          const value = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const checked = assessArtifactBackedAcceptance(value.artifact.payload.codeRevision,
            [{plan: value.plan, artifact: value.artifact}]);
          const allowedCoverageGaps = new Set(['adversarial_scenarios', 'difficulty_levels']);
          const failedCases = value.artifact.payload.results.filter(r => r.status !== 'PASS');
          const disallowedFailures = checked.requirements.filter(r =>
            r.status === 'FAIL' && !allowedCoverageGaps.has(r.requirement));
          const invalidCoverageFailures = checked.requirements.filter(r =>
            r.status === 'FAIL' && allowedCoverageGaps.has(r.requirement) &&
            (r.checkedCases === 0 || r.requiredCoverage === null ||
             r.distinctCoverage >= r.requiredCoverage));
          const unexpectedMissing = checked.requirements.filter(r =>
            r.status === 'NOT_MEASURED' && r.requirement !== 'adversarial_scenarios');
          const unfinishedCoverage = checked.requirements.filter(r =>
            allowedCoverageGaps.has(r.requirement) && r.status !== 'PASS');
          if (checked.overall !== 'FAIL' || failedCases.length > 0 ||
              disallowedFailures.length > 0 || invalidCoverageFailures.length > 0 ||
              unexpectedMissing.length > 0 || unfinishedCoverage.length === 0) {
            throw new Error('registered validation failed or acceptance status changed; review gates explicitly');
          }
          NODE
          test "$(stat -c '%a' "$oracle")" = "600"
          test "$(stat -c '%a' "$matrix")" = "600"
  regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: npm ci --no-audit --no-fund
      # Do not skip or weaken the inherited Step 12 imagery assertion.
      - run: npm test
